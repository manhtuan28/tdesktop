name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    uses: ./.github/workflows/linux.yml
  build-windows:
    uses: ./.github/workflows/win.yml
  build-mac:
    uses: ./.github/workflows/mac_packaged.yml
  build-snap:
    uses: ./.github/workflows/snap.yml

  launchpad:
    name: Publish to Launchpad PPA
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Install Debian Packaging Tools.
        run: |
          sudo apt update
          sudo apt install -y devscripts debhelper dput gnupg2

      - name: Download Linux Artifact.
        uses: actions/download-artifact@v4
        with:
          name: Linux-x64
          path: artifacts/

      - name: Prepare Binary.
        run: |
          cd artifacts
          tar -xf telegram-desktop-linux-x64.tar.xz
          # Binary is now at artifacts/Telegram

      - name: Import GPG Key.
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > private.key
          gpg --batch --import private.key
          rm private.key

      - name: Create PPA Source Package.
        run: |
          # Get version from branch/tag
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev-$(date +%Y%m%d)"
          fi
          
          chmod +x launchpad/ppa_upload_ci.sh
          # Pass Version, Binary Path, and GPG Key ID
          ./launchpad/ppa_upload_ci.sh "$VERSION" artifacts/Telegram "B4E8F7726DAE1918924DF426AB5084E43E672D45"

      - name: Upload to Launchpad PPA.
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-dev-$(date +%Y%m%d)"
          fi
          DEB_VERSION="${VERSION}-1ppa1"
          
          echo "[ppa_telegram]" > ~/.dput.cf
          echo "fqdn = ppa.launchpad.net" >> ~/.dput.cf
          echo "method = ftp" >> ~/.dput.cf
          echo "incoming = ~tuancute28/ubuntu/telegram/" >> ~/.dput.cf
          echo "login = anonymous" >> ~/.dput.cf
          echo "allow_unsigned_uploads = 0" >> ~/.dput.cf
          
          dput ppa_telegram launchpad_build/telegram-desktop_${DEB_VERSION}_source.changes

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-mac, build-snap]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Prepare Release Files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Get version from tag.
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
            echo "name=dev-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Telegram Desktop Custom v${{ steps.version.outputs.name }}"
          body: |
            ## Telegram Desktop — Custom Build

            ### Changes from official
            - ✅ All premium features unlocked (client-side)
            - ✅ All limits raised to 99999 (pins, accounts, folders, stickers, etc.)
            - ✅ Ads/sponsored messages blocked
            - ✅ Paid messages (Stars fee) bypassed
            - ✅ Update URLs point to this repository

            ### Downloads
            - **Windows**: `.zip` portable binary
            - **macOS**: `.dmg` packaged application
            - **Linux**: `.tar.xz` portable binary and `.deb` package
            - **Snap**: `.snap` package

            > **Note**: Server-side restrictions still apply. Features that require server validation may not work.
          files: release/*
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
