name: Build & Release

on:
  push:
  workflow_dispatch:

jobs:
  build-linux:
    uses: ./.github/workflows/linux.yml
  build-windows:
    uses: ./.github/workflows/win.yml
  build-mac:
    uses: ./.github/workflows/mac_packaged.yml
  build-snap:
    uses: ./.github/workflows/snap.yml

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-mac, build-snap]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Prepare Release Files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Get version from tag.
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "name=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            TELEGRAM_VERSION=$(grep "AppVersionStr " Telegram/build/version | awk '{print $2}')
            if [ -z "$TELEGRAM_VERSION" ]; then TELEGRAM_VERSION="0.0.0"; fi
            echo "tag=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
            echo "name=${TELEGRAM_VERSION}-dev-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Telegram Desktop Custom v${{ steps.version.outputs.name }}"
          body: |
            ## Telegram Desktop — Custom Build

            ### Changes from official
            - ✅ All premium features unlocked (client-side)
            - ✅ All limits raised to 99999 (pins, accounts, folders, stickers, etc.)
            - ✅ Ads/sponsored messages blocked
            - ✅ Paid messages (Stars fee) bypassed
            - ✅ Update URLs point to this repository

            ### Downloads
            - **Windows**: `.zip` portable binary
            - **macOS**: `.dmg` packaged application
            - **Linux**: `.tar.xz` portable binary and `.deb` package
            - **Snap**: `.snap` package

            > **Note**: Server-side restrictions still apply. Features that require server validation may not work.
          files: release/*
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
