name: Snap.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/snap.yml'
      - 'Telegram/build/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'

jobs:

  snap:
    name: Ubuntu
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}

    env:
      UPLOAD_ARTIFACT: "true"

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: First set up.
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo snap install --classic snapcraft
          sudo usermod -aG lxd $USER
          sudo lxd init --auto
          sudo lxd waitready

      - name: Free up some disk space.
        uses: samueldr/more-space-action@97048bd0df83fb05b5257887bdbaffc848887673
        with:
          enable-remove-default-apt-patterns: false
          enable-lvm-span: true
          lvm-span-mountpoint: /var/snap/lxd/common/lxd/storage-pools/default/containers

      - name: Snapcraft cache.
        uses: actions/cache@v6
        with:
          path: ~/.cache/snapcraft
          key: ${{ runner.OS }}-snapcraft-${{ github.sha }}
          restore-keys: ${{ runner.OS }}-snapcraft-

      - name: Use the repository API credentials.
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$TDESKTOP_API_ID" ] && [ -n "$TDESKTOP_API_HASH" ]; then
            sed -i "s|^\( *\)- -DTDESKTOP_API_ID=.*|\1- -DTDESKTOP_API_ID=$TDESKTOP_API_ID|" snap/snapcraft.yaml
            sed -i "s|^\( *\)- -DTDESKTOP_API_HASH=.*|\1- -DTDESKTOP_API_HASH=$TDESKTOP_API_HASH|" snap/snapcraft.yaml
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are missing, building with the credentials checked into snapcraft.yaml."
          fi

      - name: Telegram Desktop snap build.
        run: sudo -u $USER snap run snapcraft --verbosity=debug

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          # snapcraft names the package after 'name:' in snap/snapcraft.yaml.
          artifact_name=$(ls -1 tuangram_*.snap 2>/dev/null | head -1)
          if [ -z "$artifact_name" ]; then
            echo "::error::No tuangram_*.snap was produced by the snap build."
            ls -la
            exit 1
          fi
          echo "ARTIFACT_NAME=$artifact_name" >> $GITHUB_ENV

          mkdir artifact
          mv "$artifact_name" artifact

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifact
