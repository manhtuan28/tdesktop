name: Linux.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'

jobs:

  linux:
    name: Rocky Linux 8
    runs-on: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/nightly') && 'depot-ubuntu-latest-16' || 'ubuntu-latest' }}

    strategy:
      matrix:
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Linux-x64 ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Linux-x64" >> $GITHUB_ENV
          fi

          if [ -n "$TDESKTOP_API_ID" ] && [ -n "$TDESKTOP_API_HASH" ]; then
            echo "Use the repository credentials."
            API="-D TDESKTOP_API_ID=$TDESKTOP_API_ID -D TDESKTOP_API_HASH=$TDESKTOP_API_HASH"
          else
            echo "::warning::TDESKTOP_API_ID / TDESKTOP_API_HASH secrets are missing, falling back to the test-only api_id. Such a build cannot be used to log in."
            API="-D TDESKTOP_API_TEST=ON"
          fi

          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          $API \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: |
          docker run --rm \
          -u $(id -u) \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          $IMAGE_TAG \
          ccache --max-size=1200M

      - name: Save Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.ref_name == github.event.repository.default_branch
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/Release/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          VERSION=$(grep "^AppVersionStr " Telegram/build/version | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi

          ARTIFACT="$PWD/out/Release/artifact"
          mkdir -p "$ARTIFACT"

          # Portable tarball. Autoupdate is disabled, so CMake never builds the
          # Updater target and there is nothing else to ship next to Telegram.
          tar -cJf "$ARTIFACT/tuangram-${VERSION}-linux-x64.tar.xz" -C out/Release Telegram

          # Debian package. Everything lives under /opt/tuangram so that this
          # package never overwrites the official telegram-desktop one.
          PKGDIR="$PWD/deb-pkg"
          rm -rf "$PKGDIR"
          mkdir -p "$PKGDIR/DEBIAN"
          mkdir -p "$PKGDIR/opt/tuangram"
          mkdir -p "$PKGDIR/usr/bin"
          mkdir -p "$PKGDIR/usr/share/applications"
          mkdir -p "$PKGDIR/usr/share/icons/hicolor/256x256/apps"

          install -m 755 out/Release/Telegram "$PKGDIR/opt/tuangram/Telegram"
          ln -s /opt/tuangram/Telegram "$PKGDIR/usr/bin/tuangram"

          # The app hardcodes org.telegram.desktop as its Linux application id
          # (specific_linux.cpp: desktopFileName() / ApplicationIconName()), so
          # the .desktop and icon basenames MUST stay org.telegram.desktop or
          # themed icon lookup and Wayland window->launcher matching break.
          # Only the dpkg package name is tuangram, and it Conflicts with the
          # official telegram-desktop package because they share these paths.
          install -m 644 Telegram/Resources/art/icon256.png \
            "$PKGDIR/usr/share/icons/hicolor/256x256/apps/org.telegram.desktop.png"

          # Only the binary paths need rewriting for the /opt layout.
          sed -e 's|^TryExec=.*|TryExec=/opt/tuangram/Telegram|' \
              -e 's|^Exec=Telegram -- %U|Exec=/opt/tuangram/Telegram -- %U|' \
              -e 's|^Exec=Telegram -quit|Exec=/opt/tuangram/Telegram -quit|' \
              lib/xdg/org.telegram.desktop.desktop \
              > "$PKGDIR/usr/share/applications/org.telegram.desktop.desktop"
          chmod 644 "$PKGDIR/usr/share/applications/org.telegram.desktop.desktop"

          cat <<CONTROL > "$PKGDIR/DEBIAN/control"
          Package: tuangram
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libstdc++6, libx11-6, libxcb1, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-shm0, libxcb-sync1, libxcb-xfixes0, libxcb-xkb1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libfontconfig1, libglib2.0-0, libgl1, zlib1g
          Conflicts: telegram-desktop
          Maintainer: Manh Tuan <buimanhtuan2k4@gmail.com>
          Description: TuanGram - modded Telegram Desktop
           Fast and secure desktop PC app.
          CONTROL

          # --root-owner-group: the build tree is owned by the runner user, and
          # without it every packaged file would install as uid/gid 1001.
          dpkg-deb --root-owner-group --build "$PKGDIR" "$ARTIFACT/tuangram_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/Release/artifact/
